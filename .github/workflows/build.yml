name: Build PlusChat APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build app (Debug)
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug
        
      - name: Build app (Release)
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease
        
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pluschat-debug-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pluschat-release-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
