apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

apply plugin: 'com.android.application'

android {
    compileSdk 34
    namespace 'com.pluschat.messenger'

    defaultConfig {
        applicationId "com.pluschat.messenger"
        minSdk 21
        targetSdk 34
        versionCode 490
        versionName "10.5.2"
        multiDexEnabled true
        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']
        
        ndkVersion "27.2.12479018"

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    // Упрощенная подпись (для отладки можно убрать storeFile)
    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile file("../TMessagesProj/config/debug.keystore") // Используем дебаг ключ для сборки, пока нет релизного
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
        }
        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled false // Отключаем обфускацию для первого теста
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
        }
    }

    flavorDimensions "minApi"
    productFlavors {
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            dimension "minApi"
            ext.abiVersionCode = 9
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "PlusChat.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).ext.abiVersionCode
        }
    }
    
    variantFilter { variant ->
        def names = variant.flavors*.name
        if (!names.contains("afat")) {
            setIgnore(true)
        }
    }
}

apply plugin: 'com.google.gms.google-services'
